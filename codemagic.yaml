workflows:
  openvision-iphone:
    name: OpenVision signed iPhone IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: ca.seedtosausage.openvision
      vars:
        APPLE_TEAM_ID: JJ84AR43S2
        BUNDLE_ID: ca.seedtosausage.openvision
        META_APP_ID: "0"
        META_URL_SCHEME: ca-seedtosausage-openvision
      xcode: latest

    scripts:
      - name: Confirm Xcode and Swift versions
        script: |
          set -euo pipefail
          xcodebuild -version
          xcrun swift --version

      - name: Install Metal toolchain
        script: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain

      - name: Configure OpenVision
        script: |
          set -euo pipefail
          {
            printf 'DEVELOPMENT_TEAM = %s\n' "$APPLE_TEAM_ID"
            printf 'PRODUCT_BUNDLE_IDENTIFIER = %s\n' "$BUNDLE_ID"
            printf 'META_APP_ID = %s\n' "$META_APP_ID"
            printf 'CLIENT_TOKEN = %s\n' "${META_CLIENT_TOKEN:-}"
            printf 'APP_LINK_URL_SCHEME = %s\n' "$META_URL_SCHEME"
          } > Config.xcconfig

          cp OpenVision/Config/Config.swift.example OpenVision/Config/Config.swift

      - name: Resolve Swift packages
        script: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project OpenVision.xcodeproj \
            -scheme OpenVision

      - name: Apply managed Apple signing
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/OpenVision.xcodeproj" \
            --scheme OpenVision \
            --archive-flags="-destination 'generic/platform=iOS' -skipPackagePluginValidation -skipMacroValidation"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "build-*"
          include: true
